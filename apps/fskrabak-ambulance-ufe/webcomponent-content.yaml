apiVersion: polyfea.github.io/v1alpha1
kind: WebComponent
metadata:
  name: fskrabak-ambulance-ufe-content
spec:
  microFrontend: fskrabak-ambulance-ufe
  element: fskrabak-ambulance-wl-app
  attributes:
    - name: api-base
      value: http://localhost:30081/api
    - name: ambulance-id
      value: bobulova
  displayRules:
    - allOf:
      - context-name: main-content
      - path: "^(\\.?/)?fskrabak-ambulance-wl(/.*)?$"