apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wac-hospital  # chceme tieto objekty umiestniť do `wac-hospital` namespace
                         # tento zapis preťaží hodnoty "namespace" vo všetkých objektoch
labels:
- pairs:
    app.kubernetes.io/part-of: wac-hospital

resources:
- ../../../apps/fskrabak-ambulance-ufe
- ../../../apps/fskrabak-ambulance-webapi

patches:
- path: patches/ambulance-webapi.service.yaml
  target: # error fix
    group: ""
    version: v1
    kind: Service
    name: fskrabak-ambulance-webapi

components:
- ../../../components/version-developers
- https://github.com/filipskrabak/ambulance-webapi//deployments/kustomize/components/mongodb